services:
  - type: web
    name: healthmood
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: healthmood-db
          property: connectionString

databases:
  - name: healthmood-db
    plan: free
    databaseName: healthmood
    user: healthmood
