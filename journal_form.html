{% extends 'base.html' %}
{% block title %}Edit journal entry · HealthMood{% endblock %}
{% block content %}
<section class="page-heading compact-heading"><div><p class="eyebrow">Daily health journal</p><h1>Edit your reflection</h1><p>Update the note in the way that feels right to you.</p></div><a class="text-link" href="{{ url_for('journal') }}">← Back to journal</a></section>
<section class="single-form panel">
  <form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Date <input type="date" name="entry_date" value="{{ entry.entry_date.isoformat() }}" max="{{ today.isoformat() }}" required></label>
    <label>Title <input type="text" name="title" maxlength="160" value="{{ entry.title }}" required></label>
    <label>Your note <textarea name="body" rows="12" required>{{ entry.body }}</textarea></label>
    <div class="form-actions"><a class="button secondary" href="{{ url_for('journal') }}">Cancel</a><button class="button primary" type="submit">Save changes</button></div>
  </form>
</section>
{% endblock %}
